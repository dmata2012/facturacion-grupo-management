# Despliegue en Render. Con este archivo en la raíz del repositorio, Render
# arma el servicio solo: panel → New → Blueprint.
services:
  - type: web
    name: crm-migratorio
    runtime: node
    # Plan gratuito para empezar. Ojo: el servicio se duerme tras unos minutos
    # sin uso y la siguiente visita tarda cerca de un minuto en responder.
    # Para uso diario del despacho, cámbialo a "starter".
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /ingresar
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Cadena de conexión de PostgreSQL. Se captura en el panel de Render;
      # nunca se escribe en este archivo, que sí viaja al repositorio.
      - key: DATABASE_URL
        sync: false
      # Clave con la que se firman las sesiones. Render la genera sola.
      - key: AUTH_SECRET
        generateValue: true
      # Dirección pública del servicio, ej. https://crm-migratorio.onrender.com
      - key: AUTH_URL
        sync: false

# ── Documentos de los clientes ────────────────────────────────────
# IMPORTANTE: el disco de la aplicación se borra en cada despliegue, así que
# los documentos subidos (pasaportes, actas) se perderían al actualizar el
# sistema. Mientras esto no se resuelva, no subas documentos reales.
#
# Los discos persistentes de Render requieren plan de pago. Cuando pases a uno,
# descomenta lo siguiente y agrega la variable RUTA_ARCHIVOS=/var/data/archivos:
#
#    disk:
#      name: documentos
#      mountPath: /var/data
#      sizeGB: 1
#
# La alternativa definitiva es almacenamiento tipo S3 (Cloudflare R2, Backblaze
# B2 o AWS S3); solo hay que cambiar lib/archivos.ts.
